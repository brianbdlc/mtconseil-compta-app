<!--
  Template d'invitation — flux token_hash (voir docs/PLAN.md, Phase 1).
  Le lien atterrit sur /auth/confirm qui vérifie le token puis redirige vers
  /reinitialiser?type=invite pour que l'invité définisse son mot de passe.
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1d21; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2 style="font-size: 20px; color: #16324f; margin: 0 0 8px;">Comptabilité MT Conseil</h2>
  <p style="font-size: 14px; line-height: 1.5; color: #3a3f46;">
    Tu as été invité·e à rejoindre l'application de comptabilité de MT Conseil.
    Clique ci-dessous pour définir ton mot de passe et activer ton accès.
  </p>
  <p style="margin: 24px 0;">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/reinitialiser"
      style="display: inline-block; background: #16324f; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 6px;"
      >Définir mon mot de passe</a
    >
  </p>
  <p style="font-size: 12px; color: #6b7280;">
    Si tu n'attendais pas cette invitation, ignore ce courriel.
  </p>
</div>
